<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Film Update</title>
</head>
<body>
<nav>
    <a href="/">Main</a>
    <a href="/films">Films</a>
    <a href="/films/add">Add film</a>
    <a href="/users/<user_id>">My account</a>
    <a href="/logout">Logout</a>
  </nav>
{% if session.get('user_id') %}
Hello {{ session.get('first_name') }} {{ session.get('last_name') }}
    {% for one_film in film_list %}
        <form action="/films/update/{{ one_film["id"] }}" method="POST">
                <label for="name">Film Name:</label>
                <input type="text" id="name" name="name" value="{{ one_film["name"] }}"><br><br>
                <label for="genres">Genres (comma separated):</label>
                <input type="text" name="genres" id="genres" value="{{ genres | map(attribute='genre') | join(', ') }}"><br><br>
                <label for="year">Year:</label>
                <input type="number" id="year" name="year" value="{{ one_film["year"] }}"><br><br>
                <label for="actor_first_name">Actors' First Names (comma separated):</label>
                <input type="text" id="actor_first_name" name="actor_first_name" value="{{ actors | map(attribute='actor_first_name') | join(', ') }}"><br><br>
                <label for="actor_last_name">Actors' Last Names(comma separated):</label>
                <input type="text" id="actor_last_name" name="actor_last_name" value="{{ actors | map(attribute='actor_last_name') | join(', ') }}"><br><br>
                <br><br><label for="poster">Poster:</label>
                <input type="text" id="poster" name="poster"><br><br>
                <label for="description">Description:</label>
                <input type="text" name="description" id="description" value="{{ one_film["description"] }}"><br><br>
                <label for="duration">Duration:</label>
                <input type="number" name="duration" id="duration" value="{{ one_film["duration"] }}"><br><br>
                <label for="country">Country:</label>
                <input type="text" name="country" id="country" value="{{ one_film["country"] }}"><br><br>
                <label for="added_info">Added at:</label>
                <input type="text" name="added_info" id="added_info"><br><br>
                <button type="submit">Submit</button>
            </form>
    {% endfor %}
    {% else %}
    Hello guest!
{% endif %}
</body>
</html>
