{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
        <form action="/register" method="POST">
            <label for="user_first_name">First Name:</label>
            <input type="text" id="user_first_name" name="user_first_name" required><br><br>
            <label for="user_last_name">Last Name:</label>
            <input type="text" id="user_last_name" name="user_last_name" required><br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>
            <label for="login">Login:</label>
            <input type="text" name="login" id="login" required><br><br>
            <label for="user_email">Email:</label>
            <input type="email" name="user_email" id="user_email" required><br><br>
            <label for="user_phone_num">Phone Number:</label>
            <input type="tel" name="user_phone_num" id="user_phone_num" required><br><br>
            <label for="user_birth_date">Birth Date:</label>
            <input type="date" name="user_birth_date" id="user_birth_date"><br><br>
            <label for="user_photo">Photo:</label>
            <input type="file" accept="image/*" name="user_photo" id="user_photo"><br><br>
            <label for="user_additional_info">Additional Info:</label>
            <textarea type="text" name="user_additional_info" id="user_additional_info"></textarea><br><br>
            <button type="submit">Register</button>
        </form>
{% endblock %}
