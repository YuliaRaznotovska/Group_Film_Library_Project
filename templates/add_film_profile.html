<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Film</title>
</head>
<body>
{% if user_session %}
    Hello {{ user_session["first_name"] }} {{ user_session["last_name"] }}
    <form action="/films/add" method="POST">
            <label for="name">Film Name:</label>
            <input type="text" id="name" name="name"><br><br>
            <label for="genres">Genres (comma separated):</label>
            <input type="text" name="genres" id="genres" placeholder="Action, Drama"><br><br>
            <label for="year">Year:</label>
            <input type="number" id="year" name="year"><br><br>
            <label for="actor_first_name">Actors' First Names (comma separated):</label>
            <input type="text" id="actor_first_name" name="actor_first_name"><br><br>
            <label for="actor_last_name">Actors' Last Names(comma separated):</label>
            <input type="text" id="actor_last_name" name="actor_last_name"><br><br>
            <br><br><label for="poster">Poster:</label>
            <input type="text" id="poster" name="poster"><br><br>
            <label for="description">Description:</label>
            <input type="text" name="description" id="description"><br><br>
            <label for="rating">Rating:</label>
            <input type="number" name="rating" id="rating"><br><br>
            <label for="duration">Duration:</label>
            <input type="number" name="duration" id="duration"><br><br>
            <label for="country">Country:</label>
            <input type="text" name="country" id="country"><br><br>
            <label for="added_info">Added at:</label>
            <input type="text" name="added_info" id="added_info"><br><br>
            <button type="submit">Submit</button>
        </form>
{% else %}
Hello guest!
{% endif %}
</body>
</html>
